# /etc/nginx/sites-available/kompak-license
# Symlink → /etc/nginx/sites-enabled/kompak-license
#
# Reverse proxy untuk SuperAdmin License Manager (port 8090)
#   :80   → redirect ke HTTPS (Let's Encrypt cert)
#   :443  → proxy ke 127.0.0.1:8090 (server.py)

server {
    listen 80;
    server_name license.kompakapps.com;

    # Certbot HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name license.kompakapps.com;

    # ── SSL (diisi oleh certbot --nginx -d license.kompakapps.com) ──
    ssl_certificate     /etc/letsencrypt/live/license.kompakapps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.kompakapps.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header X-Frame-Options       "DENY"          always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Logging ──
    access_log /var/log/nginx/kompak-license.access.log;
    error_log  /var/log/nginx/kompak-license.error.log;

    # Body size limit (untuk upload future)
    client_max_body_size 10M;

    # ── Reverse proxy ke superadmin server.py ──
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
